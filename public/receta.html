<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receta — Recetario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/">🍳 Recet<span>ario</span></a>
    <div class="ms-auto d-flex gap-2" id="nav-auth">
      <a href="/login.html" class="btn btn-outline-naranja btn-sm">Iniciar Sesión</a>
    </div>
    <div id="nav-user" class="d-none align-items-center gap-3">
      <a href="/crear.html" class="btn btn-naranja btn-sm">+ Nueva Receta</a>
      <div class="dropdown">
        <button class="btn btn-outline-naranja btn-sm dropdown-toggle" data-bs-toggle="dropdown">
          👤 <span id="nav-username"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="/perfil.html">Mi Perfil</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">Cerrar Sesión</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<div class="container py-5" id="receta-cont">
  <div class="text-center py-5"><div class="spinner-border text-warning"></div></div>
</div>

<footer><p><strong>🍳 Recetario</strong> &copy; 2024</p></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
  const id = new URLSearchParams(location.search).get('id');

  document.addEventListener('DOMContentLoaded', async () => {
    actualizarNavbar();
    if (!id) { location.href = '/recetas.html'; return; }

    const r = await api('/api/recetas/' + id);
    if (r.error) { location.href = '/recetas.html'; return; }

    document.title = r.titulo + ' — Recetario';
    const dif = r.dificultad || 'Fácil';
    const difClass = dif === 'Fácil' ? 'facil' : dif === 'Media' ? 'media' : 'dificil';
    const estrellas = r.calificacion_promedio ? '★'.repeat(Math.round(r.calificacion_promedio)) + '☆'.repeat(5 - Math.round(r.calificacion_promedio)) : '';

    document.getElementById('receta-cont').innerHTML = `
      <div class="row g-5">
        <div class="col-lg-8">
          <a href="/recetas.html" class="text-muted text-decoration-none mb-3 d-inline-block">← Volver a recetas</a>
          <img src="${r.imagen_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800'}"
               class="detalle-img mb-4" alt="${r.titulo}"
               onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800'">

          <div class="d-flex gap-2 flex-wrap mb-3">
            <span class="chip chip-cat">${r.categoria_icono||'🍽️'} ${r.categoria_nombre||'Sin categoría'}</span>
            <span class="chip chip-${difClass}">${dif}</span>
          </div>

          <h1 class="fw-bold mb-2">${r.titulo}</h1>
          <p class="text-muted mb-3">por <strong>${r.autor || r.username}</strong>
            ${r.autor_bio ? `<span class="text-muted"> · ${r.autor_bio}</span>` : ''}</p>

          ${estrellas ? `<div class="estrellas mb-3">${estrellas} <span style="color:var(--muted)">${r.calificacion_promedio} / 5 (${r.total_comentarios} reseña${r.total_comentarios!=1?'s':''})</span></div>` : ''}

          <p class="mb-4" style="font-size:1.05rem;">${r.descripcion || ''}</p>

          <div class="detalle-meta mb-4">
            ${r.tiempo_prep ? `<span>⏱ Prep: <strong>${r.tiempo_prep} min</strong></span>` : ''}
            ${r.tiempo_coccion ? `<span>🔥 Cocción: <strong>${r.tiempo_coccion} min</strong></span>` : ''}
            ${r.porciones ? `<span>🍽️ <strong>${r.porciones} porciones</strong></span>` : ''}
            <span>❤️ <strong>${r.total_favoritos || 0} favoritos</strong></span>
          </div>

          <!-- Pasos -->
          <h4 class="fw-bold mb-3">📋 Preparación</h4>
          ${r.pasos?.length
            ? r.pasos.map(p => `<div class="paso-item"><div class="paso-num">${p.numero}</div><p style="padding-top:6px">${p.descripcion}</p></div>`).join('')
            : '<p class="text-muted">No hay pasos registrados.</p>'}

          <!-- Comentarios -->
          <hr class="my-5">
          <h4 class="fw-bold mb-4">💬 Comentarios</h4>

          ${estaLogueado() ? `
            <div class="card border-0 shadow-sm rounded-3 p-3 mb-4">
              <p class="fw-semibold mb-2">Deja tu comentario</p>
              <div id="stars-cont" class="mb-2"></div>
              <input type="hidden" id="cal-val">
              <textarea id="com-texto" class="form-control mb-2" rows="3" placeholder="¿Qué te pareció esta receta?"></textarea>
              <button class="btn btn-naranja btn-sm" onclick="enviarComentario()">Publicar comentario</button>
            </div>
          ` : `<p class="text-muted mb-4"><a href="/login.html" class="text-decoration-none" style="color:var(--naranja)">Inicia sesión</a> para comentar.</p>`}

          <div id="comentarios-lista">
            ${r.comentarios?.map(c => comentarioHtml(c)).join('') || '<p class="text-muted">Sin comentarios aún.</p>'}
          </div>
        </div>

        <!-- Sidebar ingredientes -->
        <div class="col-lg-4">
          <div class="filtros-box">
            <h5 class="fw-bold mb-3">🧂 Ingredientes</h5>
            <p class="text-muted small mb-3">Para ${r.porciones || 4} porciones</p>
            ${r.ingredientes?.length
              ? r.ingredientes.map(i => `<div class="ing-item"><span>${i.nombre}</span><span class="text-muted fw-semibold">${i.cantidad||''}</span></div>`).join('')
              : '<p class="text-muted">No hay ingredientes registrados.</p>'}
          </div>

          <div class="filtros-box mt-3">
            <h6 class="fw-bold mb-3">¿Te gustó esta receta?</h6>
            <button id="fav-btn" class="btn-naranja btn w-100" onclick="toggleFavorito()">
              ${r.esFavorito ? '❤️ Guardada en favoritos' : '🤍 Guardar en favoritos'}
            </button>
          </div>
        </div>
      </div>
    `;

    if (estaLogueado()) initEstrellas('stars-cont', 'cal-val');
  });

  async function toggleFavorito() {
    if (!estaLogueado()) { location.href = '/login.html'; return; }
    const btn = document.getElementById('fav-btn');
    const esFav = btn.textContent.includes('❤️');
    const res = await api('/api/favoritos/' + id, esFav ? 'DELETE' : 'POST');
    if (res.error) { toast(res.error, 'error'); return; }
    btn.textContent = esFav ? '🤍 Guardar en favoritos' : '❤️ Guardada en favoritos';
    toast(esFav ? 'Eliminado de favoritos' : 'Guardado en favoritos', esFav ? 'info' : 'success');
  }

  async function enviarComentario() {
    const texto = document.getElementById('com-texto').value.trim();
    const cal   = document.getElementById('cal-val').value;
    if (!texto) { toast('Escribe algo antes de publicar', 'error'); return; }
    const res = await api('/api/comentarios/' + id, 'POST', { contenido: texto, calificacion: cal || null });
    if (res.error) { toast(res.error, 'error'); return; }
    document.getElementById('com-texto').value = '';
    document.getElementById('cal-val').value = '';
    pintarEstrellas(document.getElementById('stars-cont'), 0);
    const lista = document.getElementById('comentarios-lista');
    lista.insertAdjacentHTML('afterbegin', comentarioHtml(res));
    toast('Comentario publicado', 'success');
  }

  function comentarioHtml(c) {
    const estrellas = c.calificacion ? '★'.repeat(c.calificacion) + '☆'.repeat(5-c.calificacion) : '';
    const fecha = new Date(c.creado_en).toLocaleDateString('es-MX', { dateStyle: 'medium' });
    return `<div class="comentario">
      <div class="d-flex justify-content-between align-items-start mb-1">
        <span class="username">${c.autor || c.username}</span>
        <span class="fecha">${fecha}</span>
      </div>
      ${estrellas ? `<div class="estrellas mb-1" style="font-size:.9rem">${estrellas}</div>` : ''}
      <p class="mb-0">${c.contenido}</p>
    </div>`;
  }
</script>
</body>
</html>
